# Tab titles: let Codex's native chat-derived pane title drive the iTerm2 tab
# while preserving tmux window names for normal shells and other tools.
set -g set-titles on
set -g set-titles-string '#{?#{m:*codex*,#{pane_current_command}},#{pane_title},#W}'

# Prevent tmux from renaming windows automatically.
setw -g automatic-rename off

# Avoid tmux target-resolution collision when window 0 is named the same as
# the session (breaks `tmux new-window -t <session>`; it resolves to the window
# named <session> at index 0 instead of "any window in <session>").
# Rename such a window to `main` on session creation.
set-hook -g session-created 'if -F "#{==:#{window_name},#{session_name}}" "rename-window -t :0 main"'

# Forward terminal focus-in/focus-out escape sequences (CSI I / CSI O) to
# inner applications so tools like Claude Code can detect when the window gains
# or loses keyboard focus.
set -g focus-events on

set -g mouse on
